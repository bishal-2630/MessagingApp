name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - '**' # Trigger on push to any branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Extract the branch name
          BRANCH_NAME="${GITHUB_REF##*/}"
          echo "Deploying branch $BRANCH_NAME to Hugging Face Spaces..."

          # Configure git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Add the Hugging Face Space as a remote using the HF Write token
          # Target Space: Bishall10/Chatme
          git remote add hf "https://Bishall10:$HF_TOKEN@huggingface.co/spaces/Bishall10/Chatme"

          # Push the current commit (HEAD) to the matching branch name on Hugging Face
          git push -f hf HEAD:"refs/heads/$BRANCH_NAME"
